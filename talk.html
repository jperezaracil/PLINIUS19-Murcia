<h1>Talk</h1>
<p class="lede">The figures of the PLINIUS 2026 talk, by slide.</p>
<figure class="card" id="talk-presentacion-figuras-01-localizaciones-b">
  <span class="slide">Slide 12 · The study</span><h3><a class="anchor" href="#talk-presentacion-figuras-01-localizaciones-b">Study sites and heatwave days per summer, 1950–2010 vs 2011–2021</a></h3>
  <a class="zoom" href="img/setup/presentacion-figuras-01-localizaciones-b.webp"><img src="img/setup/presentacion-figuras-01-localizaciones-b.webp" alt="Study sites and heatwave days per summer, 1950–2010 vs 2011–2021" width="1800" height="1012" loading="lazy"></a>
  <details><summary>About this figure</summary><p>Left: map of the 12 Mediterranean study sites. Right: mean number of heatwave days per summer (May–Aug) at each site in the training period 1950–2010 (grey) and the test period 2011–2021 (orange). Every site has more heatwave days per summer in the test period (e.g. Greece 4.3 vs 21.9).</p><p class="src">presentacion/figuras/01_localizaciones_B.png</p></details>
</figure>
<figure class="card" id="talk-presentacion-figuras-02-clusters-local">
  <span class="slide">Slide 13 · Clustering the variables</span><h3><a class="anchor" href="#talk-presentacion-figuras-02-clusters-local">Local predictors: KMeans clusters of six fields on the 1° EuroMed box</a></h3>
  <a class="zoom" href="img/setup/presentacion-figuras-02-clusters-local.webp"><img src="img/setup/presentacion-figuras-02-clusters-local.webp" alt="Local predictors: KMeans clusters of six fields on the 1° EuroMed box" width="1800" height="1012" loading="lazy"></a>
  <details><summary>About this figure</summary><p>KMeans clusters of standardized anomalies (fitted on 1950–1970) for the six local fields on the 1° EuroMed box: Tmax (k = 10), Z500 (8), MSLP (6), soil moisture (10), precipitation (6) and Mediterranean SST (6). Clusters are numbered as in the predictor names, black dots are the 12 sites, and grey nodes are not used (sea for soil moisture, land and excluded nodes for SST). Each cluster can enter the model with a time lag of 3–30 d and a window of 1–30 d; CO2 and the Etesian index, also local predictors, are not drawn.</p><p class="src">presentacion/figuras/02_clusters_local.png</p></details>
</figure>
<figure class="card" id="talk-presentacion-figuras-02-clusters-remote">
  <span class="slide">Slide 14 · Clustering the variables</span><h3><a class="anchor" href="#talk-presentacion-figuras-02-clusters-remote">Remote predictors: KMeans clusters of seven 2° fields plus NAO, ENSO and IOD</a></h3>
  <a class="zoom" href="img/setup/presentacion-figuras-02-clusters-remote.webp"><img src="img/setup/presentacion-figuras-02-clusters-remote.webp" alt="Remote predictors: KMeans clusters of seven 2° fields plus NAO, ENSO and IOD" width="1800" height="1012" loading="lazy"></a>
  <details><summary>About this figure</summary><p>KMeans clusters at 2° of Z500 and MSLP over the North Atlantic–Europe, North Atlantic SST, Z500 Asia–North Pacific, tropical SST and tropical OLR (k = 3 each) and tropical Z500 (k = 2), plus the NAO, ENSO and IOD indices; black dots are the sites where they fall inside a domain. Remote predictors can enter with a time lag of 3–90 d and a window of 1–30 d. &#x27;Tropical OLR&#x27; is the ERA5 net top-of-atmosphere longwave flux (= −OLR), labelled −OLR in the results figures.</p><p class="src">presentacion/figuras/02_clusters_remote.png</p></details>
</figure>
<figure class="card" id="talk-presentacion-figuras-03-cro-concepto">
  <span class="slide">Slide 15 · The feature selection</span><h3><a class="anchor" href="#talk-presentacion-figuras-03-cro-concepto">The CRO wrapper: from spatio-temporal predictors to selected drivers</a></h3>
  <a class="zoom" href="img/setup/presentacion-figuras-03-cro-concepto.webp"><img src="img/setup/presentacion-figuras-03-cro-concepto.webp" alt="The CRO wrapper: from spatio-temporal predictors to selected drivers" width="1800" height="1012" loading="lazy"></a>
  <details><summary>About this figure</summary><p>Conceptual view of STCO-FS: the Coral Reefs Optimization (CRO) searches about 10^219 combinations of clusters, time lags and windows, scores each candidate by the cross-validated F1 of a machine-learning model (logistic regression), and keeps a set of drivers, each a cluster region with a lag window before heatwave day t. The three drivers drawn are real choices of the Albania seed-42 run (Z500 c8, Tmax c2 and Med SST c6), which kept 26 of the 71 drivers in total. The hatched strip next to t marks days never used (time lag ≥ 3 d; at most 30 d for local and 90 d for remote drivers).</p><p class="src">presentacion/figuras/03_cro_concepto.png</p></details>
</figure>
<figure class="card" id="talk-presentacion-figuras-04c-shared-local">
  <span class="slide">Slide 16 · Results – shared clusters selected</span><h3><a class="anchor" href="#talk-presentacion-figuras-04c-shared-local">Local clusters coloured by the number of sites selecting them in 3/3 seeds</a></h3>
  <a class="zoom" href="img/selection/presentacion-figuras-04c-shared-local.webp"><img src="img/selection/presentacion-figuras-04c-shared-local.webp" alt="Local clusters coloured by the number of sites selecting them in 3/3 seeds" width="1800" height="1012" loading="lazy"></a>
  <details><summary>About this figure</summary><p>Each local cluster is coloured by how many of the 12 sites selected it in all 3 seeds (white = no site, light grey = nodes not used); black dots are the sites. The highest count is soil moisture c6, north of the Black Sea (5 sites vs 1.7 expected by chance, p = 0.013), but it is not significant after false-discovery-rate correction (q = 0.73); no cluster is shared by more sites than chance after that correction.</p><p class="src">presentacion/figuras/04c_shared_local.png</p></details>
</figure>
<figure class="card" id="talk-presentacion-figuras-05c-atlas-l-t2m-max">
  <span class="slide">Slide 17 · Results</span><h3><a class="anchor" href="#talk-presentacion-figuras-05c-atlas-l-t2m-max">Tmax: pre-heatwave anomaly maps per site (train 1950–2010)</a></h3>
  <a class="zoom" href="img/anomalies/presentacion-figuras-05c-atlas-l-t2m-max.webp"><img src="img/anomalies/presentacion-figuras-05c-atlas-l-t2m-max.webp" alt="Tmax: pre-heatwave anomaly maps per site (train 1950–2010)" width="1800" height="1012" loading="lazy"></a>
  <details><summary>About this figure</summary><p>Each panel maps the plain anomaly R (σ, vs 1980–2010) on 1950–2010 heatwave days, averaged over the representative lag window (panel title) of the site&#x27;s most-selected Tmax cluster. Thick black outline with boxed number = that cluster, thin grey outline = other clusters selected by ≥ 2 of 3 seeds at the site, small dots = p &lt; 0.05 in the year-permutation test (shown on every second node), star = site; scale ±0.6 σ. Sardinia c5, Greece c2, Libya c7 and Egypt c10 are robust in all 3 seeds; the warm patch moves with the site, largely because heatwaves are defined from the site&#x27;s own Tmax.</p><p class="src">presentacion/figuras/05c_atlas_L_t2m_max.png</p></details>
</figure>
<figure class="card" id="talk-presentacion-figuras-05c-atlas-l-z500">
  <span class="slide">Slide 18 · Results – geopotential height</span><h3><a class="anchor" href="#talk-presentacion-figuras-05c-atlas-l-z500">Z500: pre-heatwave anomaly maps per site (train 1950–2010)</a></h3>
  <a class="zoom" href="img/anomalies/presentacion-figuras-05c-atlas-l-z500.webp"><img src="img/anomalies/presentacion-figuras-05c-atlas-l-z500.webp" alt="Z500: pre-heatwave anomaly maps per site (train 1950–2010)" width="1800" height="1012" loading="lazy"></a>
  <details><summary>About this figure</summary><p>Each panel maps the plain anomaly R (σ, vs 1980–2010) on 1950–2010 heatwave days, averaged over the representative lag window (panel title) of the site&#x27;s most-selected Z500 cluster. Thick black outline with boxed number = that cluster, thin grey outline = other clusters selected by ≥ 2 of 3 seeds at the site, small dots = p &lt; 0.05 (every second node), star = site; scale ±0.6 σ. Monaco c2 (3–17 d) and Albania c8 (3–16 d), a ridge over the site, are robust in all 3 seeds, and Croatia c2 (3–9 d) in 2 of 3.</p><p class="src">presentacion/figuras/05c_atlas_L_z500.png</p></details>
</figure>
<figure class="card" id="talk-presentacion-figuras-05c-atlas-l-sstmed">
  <span class="slide">Slide 19 · Results – Mediterranean SST</span><h3><a class="anchor" href="#talk-presentacion-figuras-05c-atlas-l-sstmed">Med SST: pre-heatwave anomaly maps per site (train 1950–2010)</a></h3>
  <a class="zoom" href="img/anomalies/presentacion-figuras-05c-atlas-l-sstmed.webp"><img src="img/anomalies/presentacion-figuras-05c-atlas-l-sstmed.webp" alt="Med SST: pre-heatwave anomaly maps per site (train 1950–2010)" width="1800" height="1012" loading="lazy"></a>
  <details><summary>About this figure</summary><p>Each panel maps the plain anomaly R (σ, vs 1980–2010) on 1950–2010 heatwave days, averaged over the representative lag window (panel title) of the site&#x27;s most-selected Mediterranean SST cluster. Thick black outline with boxed number = that cluster, thin grey outline = other clusters selected by ≥ 2 of 3 seeds, small dots = p &lt; 0.05 (every second node), star = site, grey = land; scale ±0.6 σ. In most panels the anomaly is positive over most of the basin, selected or not (median +0.33 σ for the 8 clusters selected by all 3 seeds), mainly reflecting the warming trend contained in R; none of the clusters shown is robust.</p><p class="src">presentacion/figuras/05c_atlas_L_sstMed.png</p></details>
</figure>
<figure class="card" id="talk-presentacion-figuras-05c-atlas-a-sst">
  <span class="slide">Slide 20 · Results – Atlantic SST</span><h3><a class="anchor" href="#talk-presentacion-figuras-05c-atlas-a-sst">N Atlantic SST: pre-heatwave anomaly maps per site (train 1950–2010)</a></h3>
  <a class="zoom" href="img/anomalies/presentacion-figuras-05c-atlas-a-sst.webp"><img src="img/anomalies/presentacion-figuras-05c-atlas-a-sst.webp" alt="N Atlantic SST: pre-heatwave anomaly maps per site (train 1950–2010)" width="1800" height="1012" loading="lazy"></a>
  <details><summary>About this figure</summary><p>Each panel maps the plain anomaly R (σ, vs 1980–2010) on 1950–2010 heatwave days, averaged over the representative lag window (panel title) of the site&#x27;s most-selected North Atlantic SST cluster. Thick black outline with boxed number = that cluster (other selected clusters are not outlined), small dots = p &lt; 0.05, grey = land and excluded nodes, star = Murcia at the domain edge; scale ±0.4 σ. Syria selected no cluster of this field; Turkey c1 (40–47 d) is robust in both seeds that selected it, and no other panel is robust.</p><p class="src">presentacion/figuras/05c_atlas_A_sst.png</p></details>
</figure>
<figure class="card" id="talk-presentacion-figuras-05c-atlas-t-sst">
  <span class="slide">Slide 21 · Results – tropical SST</span><h3><a class="anchor" href="#talk-presentacion-figuras-05c-atlas-t-sst">Tropical SST: pre-heatwave anomaly maps per site (train 1950–2010)</a></h3>
  <a class="zoom" href="img/anomalies/presentacion-figuras-05c-atlas-t-sst.webp"><img src="img/anomalies/presentacion-figuras-05c-atlas-t-sst.webp" alt="Tropical SST: pre-heatwave anomaly maps per site (train 1950–2010)" width="1800" height="1012" loading="lazy"></a>
  <details><summary>About this figure</summary><p>Each panel maps the plain anomaly R (σ, vs 1980–2010) on 1950–2010 heatwave days, averaged over the representative lag window (panel title) of the site&#x27;s most-selected tropical SST cluster. Thick black outline with boxed number = that cluster (other selected clusters are not outlined), small dots = p &lt; 0.05, grey = land; scale ±0.4 σ. Turkey c2 (66–69 d) is robust in both seeds that selected it; no other panel is robust.</p><p class="src">presentacion/figuras/05c_atlas_T_sst.png</p></details>
</figure>
<figure class="card" id="talk-eof-figuras-l-z500-2b-reof-selected">
  <span class="slide">Slide 22 · Results – rotated PC</span><h3><a class="anchor" href="#talk-eof-figuras-l-z500-2b-reof-selected">Local Z500: rotated modes linked to the CRO-selected precursor clusters</a></h3>
  <a class="zoom" href="img/eof/eof-figuras-l-z500-2b-reof-selected.webp"><img src="img/eof/eof-figuras-l-z500-2b-reof-selected.webp" alt="Local Z500: rotated modes linked to the CRO-selected precursor clusters" width="1800" height="1012" loading="lazy"></a>
  <details><summary>About this figure</summary><p>The eight rotated modes of local Z500 (N = 8, as in the rotated-EOF maps above), linked to the CRO selection: a yellow star marks a site where a cluster of that mode, selected in at least 2 of the 3 seeds, has a significant pre-heatwave plain-anomaly contrast (year-permutation p &lt; 0.05 in train 1950–2010 and in test 2011–2021, same sign); its label gives the site, the cluster when the mode holds two, and the lag window. All qualifying clusters are starred, not only each site&#x27;s strongest one, so Albania, Greece and Algeria appear in two modes. Faded modes (RPC2, RPC4, RPC5, RPC8, their clusters in grey) have no such cluster at any site; the active ones are RPC3 (c2, c8), RPC1 (c5), RPC7 (c3) and RPC6 (c4).</p><p class="src">eof/figuras/L_z500_2b_reof_selected.png</p></details>
</figure>
